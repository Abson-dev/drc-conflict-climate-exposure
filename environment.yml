name: drc-exposure
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=2.0
  - pandas>=2.2
  - xarray>=2024.1
  - netcdf4>=1.7
  - geopandas>=1.0
  - shapely>=2.0
  - pyproj>=3.6
  - rasterio>=1.4
  - scikit-learn>=1.5
  - requests>=2.32
  - pip
  - pip:
      - cdsapi>=0.7.7
      - truststore>=0.10   # use the Windows/macOS certificate store (needed behind TLS-inspecting proxies)
